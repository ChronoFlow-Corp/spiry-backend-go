services:
  spiry:
    build:
      target: app
    depends_on:
      database:
          condition: service_healthy
          restart: true
    env_file:
      - .env
    ports:
      - "1337:1337"
  database:
    image: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s